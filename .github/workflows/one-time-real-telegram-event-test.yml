name: One-Time Real Telegram Event Test

on:
  push:
    branches: [main]
    paths: ['data/telegram-live-test-request.json']

permissions:
  contents: write

jobs:
  send-real-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Send one real verified upcoming event
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          data=json.loads(Path('data/verified_radar/latest.json').read_text(encoding='utf-8'))
          now=datetime.now(timezone.utc)
          events=[e for e in data.get('events',[]) if datetime.fromisoformat(e['start_at']).astimezone(timezone.utc)>now]
          if not events:
              raise SystemExit('No verified upcoming event available for live test')
          event=sorted(events,key=lambda e:datetime.fromisoformat(e['start_at']))[0]
          bkk=ZoneInfo('Asia/Bangkok')
          start=datetime.fromisoformat(event['start_at']).astimezone(bkk)
          end=datetime.fromisoformat(event['end_at']).astimezone(bkk) if event.get('end_at') else None
          when=start.strftime('%d %b %Y %H:%M')
          if end:
              when += '–' + (end.strftime('%H:%M') if end.date()==start.date() else end.strftime('%d %b %H:%M'))
          text='\n'.join([
              '🩺 FREE MEDICAL EVENT · LIVE TEST',
              event['title'],
              f'📅 {when} ICT',
              f"📍 {event.get('mode','')} · {event.get('language','').upper()}",
              f"🎓 Certificate: {event.get('certificate','Not stated')}",
              f"CME/CPD: {event.get('credits','Not stated')}",
              '🔗 '+event.get('registration_url',event.get('source_url','')),
              '',
              '✅ Real upcoming event selected from the current verified radar output.'
          ])
          token=os.environ['TELEGRAM_BOT_TOKEN']; chat=os.environ['TELEGRAM_CHAT_ID']
          req=urllib.request.Request(
              'https://api.telegram.org/bot'+token+'/sendMessage',
              data=json.dumps({'chat_id':chat,'text':text,'disable_web_page_preview':True}).encode(),
              headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req,timeout=25) as response:
              payload=json.load(response)
          message=payload.get('result',{})
          mid=message.get('message_id')
          if payload.get('ok') is not True or isinstance(mid,bool) or not isinstance(mid,int) or mid<=0:
              raise RuntimeError('Telegram did not return a valid acknowledgement')
          receipt={
              'sent_at':datetime.now(timezone.utc).isoformat(),
              'message_id':mid,
              'telegram_date':message.get('date'),
              'event':event,
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
              'kind':'one-time-real-event-live-test'
          }
          Path('data/verified_radar/live_test_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('REAL EVENT TELEGRAM ACK message_id='+str(mid))
          PY
      - name: Persist live-test receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verified_radar/live_test_receipt.json
          git diff --cached --quiet || (git commit -m 'Record one-time real Telegram event test receipt' && git pull --rebase origin main && git push origin HEAD:main)
