name: One-time Telegram Visual Preview
on:
  push:
    branches: [preview/telegram-medical-20260907]
    paths: [.github/workflows/telegram-visual-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-visual-preview-20260907
  cancel-in-progress: false
jobs:
  send-preview:
    if: github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[send-visual-preview-20260907]'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: |
          python -m pip install 'Pillow>=10,<13'
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-dejavu-core
          fi
      - name: Run six preview and delivery-safety tests
        run: python -m unittest discover -s preview -p test_preview.py -v
      - name: Send requested four-panel album to existing Telegram chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python preview/visual_preview.py --send --output preview-output
      - name: Preserve preview and safe delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-visual-preview-20260907
          path: preview-output/
          if-no-files-found: ignore
          retention-days: 14
