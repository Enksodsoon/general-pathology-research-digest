name: Full Fresh Live Telegram Preview
on:
  push:
    branches: [preview/telegram-medical-20260907]
    paths: [.github/workflows/telegram-fresh-live-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-fresh-live-preview-20260907
  cancel-in-progress: false
jobs:
  fresh-live-send:
    if: github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[send-fresh-live-20260907]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Bangkok
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install digest and image dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'Pillow>=10,<13'
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-dejavu-core
          fi
      - name: Verify existing research pipeline
        run: python -m pytest -q
      - name: Verify fresh visual selection and rendering
        working-directory: preview
        run: python -m unittest test_fresh_visual.py -v
      - name: Generate a fresh live medical digest now
        run: python -m med_digest.cli --live --date "$(date +%F)"
      - name: Select a fresh paper, retrieve PubMed abstract, render, and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python preview/fresh_visual_preview_v2.py --digest digests/latest.md --send --output fresh-live-output
      - name: Preserve fresh selection, panels, and Telegram receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-fresh-live-preview-20260907
          path: fresh-live-output/
          if-no-files-found: ignore
          retention-days: 14
