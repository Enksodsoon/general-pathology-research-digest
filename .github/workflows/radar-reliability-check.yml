name: Radar Reliability Check
on:
  push:
    branches: [codex/radar-reliability-final-20260907]
    paths: ['event_scout/verified*.py','tests/test_verified_reliability.py','scripts/radar_*.py','config/verified_sources.json','.github/workflows/radar-reliability-check.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-reliability-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Regression results
        id: tests
        continue-on-error: true
        run: |
          mkdir -p repair_evidence/reliability
          python -m pytest -q --tb=short > repair_evidence/reliability/tests.txt 2>&1
      - name: Source endpoints
        run: python -m scripts.radar_source_probe
      - name: Live scan after tests pass
        if: steps.tests.outcome == 'success'
        run: python -m event_scout.verified_scan --output repair_evidence/reliability/live
      - name: Save evidence on repair branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair_evidence/reliability
          git diff --cached --quiet || (git commit -m 'Record readiness regression and source evidence' && git push)
      - name: Preserve failing test status
        if: steps.tests.outcome == 'failure'
        run: exit 1
