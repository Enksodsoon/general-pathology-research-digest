name: Radar Reliability Check
on:
  push:
    branches: [codex/radar-reliability-final-20260907]
    paths: ['event_scout/verified*.py','tests/test_verified*.py','config/verified_sources.json','.github/workflows/*medical*.yml','.github/workflows/radar-reliability-check.yml']
  pull_request:
    paths: ['event_scout/verified*.py','tests/test_verified*.py','config/verified_sources.json','.github/workflows/*medical*.yml','.github/workflows/radar-reliability-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Regression suite without delivery access
        run: python -m pytest -q
      - run: python -m compileall -q event_scout
      - name: Validate inventory and recovery guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from event_scout.verified_reliability import should_run
          from datetime import datetime, timezone
          sources=json.loads(Path('config/verified_sources.json').read_text())['sources']
          assert len({s['id'] for s in sources})==len(sources)
          assert {s['language'] for s in sources}=={'en','th','ja'}
          assert should_run({},datetime.now(timezone.utc),'recovery')
          print('Validated',len(sources),'unique checks and the initial recovery path')
          PY
