name: Event Radar Regression Check
on:
  pull_request:
    paths: ['event_scout/verified*.py','tests/test_verified*.py','config/verified_sources.json','requirements.txt','.github/workflows/*medical*.yml','.github/workflows/event-radar-repair-check.yml']
  push:
    branches: [codex/repair-event-radar-20260907]
    paths: ['event_scout/verified*.py','tests/test_verified*.py','config/verified_sources.json','requirements.txt','.github/workflows/event-radar-repair-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q event_scout
      - name: Validate source inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('config/verified_sources.json').read_text())
          sources=config['sources']
          assert len({s['id'] for s in sources})==len(sources)
          assert {s['language'] for s in sources}=={'en','th','ja'}
          assert all(s.get('engine')=='google_news' for s in sources if s.get('kind')=='search')
          print(len(sources), 'unique source/query checks validated')
          PY
