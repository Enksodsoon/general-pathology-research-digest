name: Event Radar Repair Check
on:
  push:
    branches: [codex/repair-event-radar-20260907]
    paths: ['scripts/probe_event_repair.py', '.github/workflows/event-radar-repair-check.yml', 'event_scout/verified*.py', 'tests/test_verified*.py', 'config/verified_sources.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: event-radar-repair-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt beautifulsoup4
      - run: python -m pytest -q
      - run: python -m scripts.probe_event_repair
      - name: Dry live scan when repair is present
        run: |
          if [ -f event_scout/verified_scan.py ]; then
            python -m event_scout.verified_scan --output repair_evidence/live
          fi
      - name: Save inspection evidence on repair branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair_evidence || true
          git diff --cached --quiet || (git commit -m 'Record event radar repair verification' && git push)
