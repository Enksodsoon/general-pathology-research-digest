name: Event Radar Repair Check
on:
  push:
    branches: [codex/repair-event-radar-20260907]
    paths: ['scripts/*verified*.py', 'scripts/apply_event_quality_patch.py', '.github/workflows/event-radar-repair-check.yml', 'event_scout/verified*.py', 'tests/test_verified*.py', 'config/verified_sources.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: event-radar-repair-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Apply isolated quality migrations
        run: |
          python -m scripts.apply_event_quality_patch
          python -m scripts.finalize_verified_guardrails
      - run: python -m pytest -q
      - name: Dry live scan without delivery credentials
        run: python -m event_scout.verified_scan --output repair_evidence/live
      - name: Save verified repair code and inspection evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add event_scout/verified*.py config/verified_sources.json repair_evidence README.md docs/MEDICAL_EVENT_RADAR.md
          git diff --cached --quiet || (git commit -m 'Record final regression-tested radar and live evidence' && git push)
