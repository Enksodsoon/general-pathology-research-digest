name: Daily Free Medical Events
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '43 0 * * *'       # 07:43 Bangkok primary
    - cron: '17 3,6,9 * * *'  # 10:17, 13:17, 16:17 Bangkok recovery opportunities
  workflow_run:
    workflows: ['Daily Digest']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['event_scout/verified*.py','tests/test_verified*.py','config/verified_sources.json','.github/workflows/daily-medical-events.yml']
permissions:
  contents: write
concurrency:
  group: verified-medical-events-production
  cancel-in-progress: false
jobs:
  radar:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Daily delivery and recovery guard
        id: guard
        run: |
          if [ '${{ github.event_name }}' = 'schedule' ] || [ '${{ github.event_name }}' = 'workflow_run' ]; then
            python -m event_scout.verified_notify --guard --stage recovery >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
          printf '### Trigger evidence\nEvent: `%s`\nSchedule: `%s`\n' '${{ github.event_name }}' '${{ github.event.schedule }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Record bounded daily attempt
        if: steps.guard.outputs.skip != 'true'
        run: python -m event_scout.verified_notify --begin
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt
      - name: Regression suite
        if: steps.guard.outputs.skip != 'true'
        run: python -m pytest -q
      - name: Discover and verify live events
        if: steps.guard.outputs.skip != 'true'
        id: scan
        timeout-minutes: 17
        run: python -m event_scout.verified_scan
      - name: Deliver individual alerts and daily health
        if: steps.guard.outputs.skip != 'true'
        id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m event_scout.verified_notify
      - name: Record scan or delivery failure
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m event_scout.verified_notify --failure 'Workflow failed'
      - name: Upload durable run evidence
        id: archive
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: medical-event-radar-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/verified_radar/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist reports and acknowledged receipts
        id: persist
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p events data/verified_radar
          if [ '${{ steps.scan.outcome }}' = 'success' ] && [ -f data/verified_radar/latest.md ]; then
            cp data/verified_radar/latest.md events/latest.md
            cp data/verified_radar/latest.md "events/$(date +%F).md"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verified_radar events
          if ! git diff --cached --quiet; then
            git commit -m 'Record medical radar scan, recovery state and Telegram acknowledgements'
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
      - name: Report storage failure explicitly
        if: always() && (steps.persist.outcome == 'failure' || steps.archive.outcome == 'failure')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m event_scout.verified_notify --failure 'Evidence persistence failed'
