name: Daily Free Medical Events
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '43 0 * * *'  # 07:43 Bangkok; GitHub can delay scheduled jobs.
    - cron: '17 3 * * *'  # 10:17 Bangkok recovery if no completed daily delivery.
  push:
    branches: [main]
    paths: ['event_scout/verified*.py','tests/test_verified*.py','config/verified_sources.json','.github/workflows/daily-medical-events.yml']
permissions:
  contents: write
concurrency:
  group: verified-medical-events-production
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Daily delivery guard
        id: guard
        run: |
          if [ '${{ github.event_name }}' = 'schedule' ]; then
            python -m event_scout.verified_notify --guard >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt
      - name: Regression suite
        if: steps.guard.outputs.skip != 'true'
        run: python -m pytest -q
      - name: Discover and verify live events
        if: steps.guard.outputs.skip != 'true'
        id: scan
        timeout-minutes: 14
        run: python -m event_scout.verified_scan
      - name: Deliver event alerts and daily health message
        if: steps.guard.outputs.skip != 'true'
        id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m event_scout.verified_notify
      - name: Report failure without claiming successful delivery
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m event_scout.verified_notify --failure 'Workflow failed'
      - name: Preserve reports and acknowledged receipts
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p events data/verified_radar
          if [ '${{ steps.scan.outcome }}' = 'success' ] && [ -f data/verified_radar/latest.md ]; then
            cp data/verified_radar/latest.md events/latest.md
            cp data/verified_radar/latest.md "events/$(date +%F).md"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verified_radar events
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified medical event scan and Telegram acknowledgements'
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              git rebase --abort || true
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.skip != 'true'
        with:
          name: medical-event-radar-${{ github.run_id }}
          path: data/verified_radar/
          retention-days: 30
